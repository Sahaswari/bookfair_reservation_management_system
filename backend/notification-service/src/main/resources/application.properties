spring.application.name=notification-service

# Server Configuration
server.port=8083

# Database Configuration
spring.datasource.url=jdbc:postgresql://notification-postgres:5432/notification_service_db?stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.generate-ddl=false

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=15
spring.flyway.connect-retries-interval=5s

# Connection Pool Configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# Logging Configuration
logging.level.com.bookfair.notification_service=DEBUG

# Kafka Configuration
app.kafka.enabled=true
app.kafka.user-events-topic=user-events
app.kafka.reservation-events-topic=reservation-events
app.kafka.consumer-group-id=notification-service-user-sync
app.kafka.listener-concurrency=1
app.kafka.retry.max-attempts=3
app.kafka.retry.initial-interval-ms=2000
app.kafka.retry.max-interval-ms=60000
app.kafka.retry.multiplier=2.0

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply@bookfair.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Notification Configuration
app.notification.email.enabled=true
app.notification.sms.enabled=false