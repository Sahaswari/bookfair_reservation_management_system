spring.application.name=reservation-service

# Server Configuration
server.port=8086

# Database Configuration - Use Docker Compose PostgreSQL service
spring.datasource.url=jdbc:postgresql://reservation-postgres:5432/reservation_service_db?stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable Docker Compose when running in containers (already managed by docker-compose)
spring.docker.compose.enabled=false

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=15
spring.flyway.connect-retries-interval=5s

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# Logging Configuration
logging.level.com.bookfair.reservation_service=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Kafka Configuration
app.kafka.enabled=true
app.kafka.user-events-topic=user-events
app.kafka.stall-events-topic=stall-events
app.kafka.reservation-events-topic=reservation-events
app.kafka.consumer-group-id=reservation-service-user-sync
app.kafka.listener-concurrency=1
app.kafka.retry.max-attempts=3
app.kafka.retry.initial-interval-ms=2000
app.kafka.retry.max-interval-ms=60000
app.kafka.retry.multiplier=2.0

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false
